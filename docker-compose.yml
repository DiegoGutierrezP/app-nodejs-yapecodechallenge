version: "3.7"
services:
  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=transactions
  zookeeper:
    image: confluentinc/cp-zookeeper:5.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-enterprise-kafka:5.5.3
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
    ports:
      - 9092:9092

   # Transaction microservice
  transaction:
    build:
      context: .  # Carpeta raíz del proyecto
      dockerfile: ./apps/transaction/Dockerfile 
    container_name: "transaction_service"
    ports:
      - "3001:3000"  # Puerto expuesto en el host
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env

   # Anti-fraud microservice
  anti-fraud:
    build:
      context: .  # Carpeta raíz del proyecto
      dockerfile: ./apps/anti-fraud/Dockerfile 
    container_name: "anti_fraud_service"
    depends_on:
      - kafka
    env_file:
      - .env
